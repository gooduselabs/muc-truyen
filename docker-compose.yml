# Mực — full stack: Postgres + API (auto migrate + seed) + Web.
#   docker compose up --build   →  web http://localhost:3000 · api http://localhost:4000
services:
  db:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: story, POSTGRES_PASSWORD: story, POSTGRES_DB: story }
    volumes: [db:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U story"], interval: 3s, retries: 20 }
  api:
    build: ./backend
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://story:story@db:5432/story
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      PUBLIC_URL: http://localhost:4000
      WEB_URL: http://localhost:3000
    ports: ["4000:4000"]
    volumes: [uploads:/app/uploads]
  web:
    build: { context: ./web, args: { NEXT_PUBLIC_API_URL: http://localhost:4000 } }
    depends_on: [api]
    environment: { API_INTERNAL_URL: http://api:4000 }
    ports: ["3000:3000"]
volumes: { db: {}, uploads: {} }
